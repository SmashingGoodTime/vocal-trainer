# Only the offline Python pipeline is covered here.
#
# The C++ side is deliberately not built in CI: it needs a JUCE 9 clone, and using
# JUCE's free Starter tier requires a registered juce.com account and acceptance of
# the EULA. A CI runner cannot accept a licence on anyone's behalf, and an
# unregistered clone would build as AGPLv3. See THIRD-PARTY.md.
name: python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.11,<3.13" in python/pyproject.toml.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install the analysis package
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        working-directory: python
        run: python -m pytest -q
